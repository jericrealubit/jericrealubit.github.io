<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>duoNav legal</title>
<meta name="description" content="duoNav privacy policy, terms of use and open-source notices.">
<link rel="canonical" href="https://jericrealubit.github.io/duonav/legal/">
<link rel="icon" href="../assets/duonav-mark.svg" type="image/svg+xml">
<style>
:root { --ink: #141414; --muted: #5F5B53; --paper: #FFFFFF; --ground: #ECEAE5; --line: #D2CEC5; --accent: #1D5FD6; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --ink: #EDEBE6; --muted: #A9A6A0; --paper: #1E1F23; --ground: #141518; --line: #3A3D43; --accent: #8AB0F5; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
a { color: var(--accent); }
header { max-width: 820px; margin: 0 auto; padding: 24px 16px 8px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
header .logo { display: block; line-height: 0; }
header .logo img { height: 36px; width: auto; }
header .logo .night { display: none; }
@media (prefers-color-scheme: dark) { header .logo .day { display: none; } header .logo .night { display: inline; } }
nav { display: flex; flex-wrap: wrap; gap: 4px 16px; font-weight: 600; }
nav a { color: var(--ink); text-decoration: none; padding: 8px 0; }
nav a[aria-current="page"] { text-decoration: underline; text-underline-offset: 6px; }
main { max-width: 820px; margin: 0 auto; padding: 0 16px 48px; }
article { background: var(--paper); border-radius: 18px; padding: 24px 20px; }
@media (min-width: 700px) { article { padding: 40px 48px; } }
h1 { font-size: 32px; line-height: 1.2; margin: 0 0 12px; }
h2 { font-size: 22px; line-height: 1.3; margin: 36px 0 8px; }
h3 { font-size: 18px; margin: 24px 0 6px; }
.toc { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; margin: 20px 0; }
.toc ol { margin: 0; padding-left: 20px; columns: 2; column-gap: 32px; }
@media (max-width: 560px) { .toc ol { columns: 1; } }
.table { overflow-x: auto; margin: 16px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
th { font-weight: 700; }
code { font-size: 0.9em; }
blockquote { margin: 16px 0; padding: 8px 16px; border-left: 3px solid var(--line); color: var(--muted); }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: 20px; }
.cards a { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 14px; color: var(--ink); text-decoration: none; }
.cards a strong { display: block; color: var(--accent); }
footer { max-width: 820px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
  <header>
    <a class="logo" href="../" aria-label="duoNav home">
      <img class="day" src="../assets/duonav-logo.svg" alt="duoNav" width="123" height="36">
      <img class="night" src="../assets/duonav-logo-white.svg" alt="duoNav" width="123" height="36">
    </a>
    <nav aria-label="Legal">
      <a href="../legal/privacy/">Privacy</a>
      <a href="../legal/terms/">Terms</a>
      <a href="../legal/open-source/">Open source</a>
    </nav>
  </header>
  <main>
    <article>
<h1>duoNav legal</h1>
<p>duoNav has no account, no ads and no tracking. These pages say exactly what that means.</p>
<div class="cards">
<a href="../legal/privacy/"><strong>Privacy policy</strong></a>
<a href="../legal/terms/"><strong>Terms of use</strong></a>
<a href="../legal/open-source/"><strong>Open-source notices and attributions</strong></a>
</div>
    </article>
  </main>
  <footer>Map data © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors.</footer>
</body>
</html>
